# Builds an unsigned Tetherview.ipa on GitHub's Mac runners, so nobody needs a
# Mac. Install the .ipa with Sideloadly or AltStore (see README).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-core:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (protocol core)
        run: swift test

  build-ipa:
    runs-on: macos-latest
    needs: test-core
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Tetherview.xcodeproj \
            -scheme Tetherview \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*Tetherview|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Tetherview.app

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Tetherview.app Payload/
          zip -qry Tetherview.ipa Payload
          ls -la Tetherview.ipa

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tetherview-ipa
          path: Tetherview.ipa

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log

      - name: Attach to GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Tetherview.ipa
